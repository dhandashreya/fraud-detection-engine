name: real-data-benchmark

# Heavy (~150 MB dataset download) -- kept out of the main CI job. Runs on
# demand and once a month so a dependency bump that breaks the real-data path
# still gets caught.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - uses: actions/cache@v4
        with:
          path: real_data/openml_cache
          key: openml-creditcard-1597
      - run: pytest tests/test_real_data_benchmark.py -v
        env:
          RUN_REAL_DATA: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-data-benchmark-report
          path: |
            reports/real_data_benchmark.md
            reports/real_data_benchmark.json
            reports/real_data_pr_curve.png
